[project]
site_url = "https://electronplant.github.io"
site_name = "ElectronPlant"
site_description = """
Portfolio of David Arnaiz. Embedded Firmware Engineer specializing in adaptive IoT sensors, RTOS, and dynamic energy management for low-power devices.
"""
site_author = "David Arnaiz"

repo_name = "electronplant.github.io"
repo_url = "https://github.com/ElectronPlant/electronplant.github.io/"
edit_uri = "edit/main/docs/"

use_directory_urls = true
copyright = "Copyright © 2026 David Arnaiz"
extra_css = ["extra_style.css"]
extra_templates = [
    "google009ed8c895b10d28.html", # site verification file for Google
    "BingSiteAuth.xml",            # site verification file for Bing
    "robots.txt",
]

nav = [
    { "Profile" = "index.md" },
    { "Research" = [
        "research/index.md",
        "research/thesis.md",
    ] },
    { "Projects" = [
        "projects/index.md",
    ] },
    { "Blog" = [
        "blog/index.md",
    ] },
    { "info" = "info/index.md" },
]

[project.theme]
variant = "classic"
language = "en"
logo = "assets/imgs/ElectronPlantLogo.png"
favicon = "assets/imgs/ElectronPlantLogo.png"
pallete.primary = "indigo"
features = [
    "navigation.tabs",
    "navigation.top",
    "navigation.indexes",
    "navigation.instant",
    "navigation.tracking",
]

# --- Light/Dark mode ---
# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to system preference"

# --- Social Links ---
[[project.extra.social]]
icon = "octicons/mail-16"
link = "mailto://electronplant@gmail.com"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ElectronPlant"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/david-arnaiz-mart%C3%ADnez"

[[project.extra.social]]
icon = "fontawesome/brands/google-scholar"
link = "https://scholar.google.com/citations?user=32m35KwAAAAJ&hl=en"

[project.extra]
# Remove the made with zensical note in the footer.
generator = false

[project.plugins.blog]
