# Project information
site_name: David Arnaiz
site_url: https://electronplant.github.io/personal-page/
repo_name: personal-page
repo_url: https://github.com/ElectronPlant/personal-page/
site_description: >-
  Embedded Firmware Engineer specializing in adaptive IoT sensors, RTOS, and dynamic energy management for low-power devices. Portfolio of David Arnaiz.
use_directory_urls: true
docs_dir: './build'
site_dir: './build'

# Copyright
copyright: Copyright © 2026 David Arnaiz

# Configuration
theme:
  name: material
  language: en

  palette:
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-3
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

extra_css:
    - extra_style.css

markdown_extensions:
  - attr_list:
  - md_in_html:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
    - print-site:
